services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: fourcut
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    # 이미지는 GitHub Actions 가 빌드해 GHCR 에 올린다. 서버는 pull 만 한다.
    # build 는 로컬에서 직접 띄워볼 때(docker compose up --build)를 위한 것.
    image: ghcr.io/four-cut/backend:latest
    build: .
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/fourcut?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_APP_ID: ${KAKAO_APP_ID}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
    depends_on:
      - db

volumes:
  mysql_data:
