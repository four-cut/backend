name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,DB_ROOT_PASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_S3_BUCKET,JWT_SECRET,KAKAO_APP_ID,KAKAO_ADMIN_KEY,GOOGLE_CLIENT_IDS
          script: |
            cd /home/parkdu7/four-cut
            git pull origin main
            printf 'DB_USERNAME=%s\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_REGION=%s\nAWS_S3_BUCKET=%s\nJWT_SECRET=%s\nKAKAO_APP_ID=%s\nKAKAO_ADMIN_KEY=%s\nGOOGLE_CLIENT_IDS=%s\n' \
              "$DB_USERNAME" "$DB_PASSWORD" "$DB_ROOT_PASSWORD" \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_REGION" "$AWS_S3_BUCKET" \
              "$JWT_SECRET" "$KAKAO_APP_ID" "$KAKAO_ADMIN_KEY" "$GOOGLE_CLIENT_IDS" > .env
            chmod 600 .env
            docker compose down app
            docker compose build app
            docker compose up -d app
