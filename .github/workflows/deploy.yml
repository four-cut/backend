name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE: ghcr.io/four-cut/backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 서버(E2.1.Micro, RAM 1GB)에서 Gradle 빌드를 돌리면 메모리가 모자라므로
      # 이미지는 여기서 만들고 서버는 받아서 띄우기만 한다.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_APP_ID: ${{ secrets.KAKAO_APP_ID }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_USERNAME,DB_PASSWORD,DB_ROOT_PASSWORD,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,AWS_S3_BUCKET,JWT_SECRET,KAKAO_APP_ID,KAKAO_ADMIN_KEY,GOOGLE_CLIENT_IDS,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            # 서버 사용자 홈 아래에 클론해 둔다 (홈서버: parkdu7, OCI: ubuntu).
            cd ~/four-cut
            git pull origin main
            printf 'DB_USERNAME=%s\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_REGION=%s\nAWS_S3_BUCKET=%s\nJWT_SECRET=%s\nKAKAO_APP_ID=%s\nKAKAO_ADMIN_KEY=%s\nGOOGLE_CLIENT_IDS=%s\n' \
              "$DB_USERNAME" "$DB_PASSWORD" "$DB_ROOT_PASSWORD" \
              "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_REGION" "$AWS_S3_BUCKET" \
              "$JWT_SECRET" "$KAKAO_APP_ID" "$KAKAO_ADMIN_KEY" "$GOOGLE_CLIENT_IDS" > .env
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # pull 이 실패하면 set -e 로 여기서 멈추고, 떠 있던 컨테이너는 그대로 남는다.
            docker compose pull app
            docker compose up -d app
            docker logout ghcr.io
            docker image prune -f
