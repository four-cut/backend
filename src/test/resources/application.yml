spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: false

fourcut:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    presigned-url-expiry-minutes: 10080
  session:
    expiry-minutes: 30
  jwt:
    secret: test-secret-key-for-tests-only-do-not-use-in-production-0123456789
    access-token-expiry-minutes: 60
    refresh-token-expiry-days: 30
  oauth:
    kakao:
      app-id: 999999
      admin-key: test-admin-key
    google:
      client-ids: test-client-id.apps.googleusercontent.com
  auth:
    login-rate-limit-per-minute: 20
