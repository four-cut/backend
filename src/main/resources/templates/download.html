<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="robots" content="noindex, nofollow">
	<title>찍고갈래? 사진 받기</title>
	<style>
		/* 부스에서 QR 을 찍은 손님 폰에서만 열린다. 외부 폰트나 스크립트는 쓰지 않는다. */
		:root {
			color-scheme: dark;
			--bg: #111111;
			--card: #1c1c1e;
			--text: #ffffff;
			--muted: #9a9a9f;
			--accent: #ffffff;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
			min-height: 100vh;
			background: var(--bg);
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
			display: flex;
			justify-content: center;
		}
		main { width: 100%; max-width: 420px; }
		h1 { margin: 0 0 4px; font-size: 22px; }
		p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
		.card {
			background: var(--card);
			border-radius: 20px;
			padding: 16px;
			margin-bottom: 20px;
		}
		.preview { width: 100%; border-radius: 12px; display: block; }
		.actions { display: flex; flex-direction: column; gap: 12px; }
		a.button {
			display: block;
			padding: 16px;
			border-radius: 14px;
			background: var(--accent);
			color: #111111;
			font-size: 16px;
			font-weight: 600;
			text-align: center;
			text-decoration: none;
		}
		a.button.secondary {
			background: transparent;
			color: var(--text);
			border: 1px solid #3a3a3d;
		}
		p.note { margin: 20px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
	</style>
</head>
<body>
<main>
	<h1>찍고갈래?</h1>

	<!-- 링크가 없거나 만료된 경우. QR 을 찍은 사람에게 JSON 에러를 띄울 수는 없다. -->
	<div th:if="${errorMessage}">
		<p class="sub" th:text="${errorMessage}">링크를 찾을 수 없습니다.</p>
		<p class="note">부스에서 새로 촬영하면 새 QR 이 나옵니다.</p>
	</div>

	<div th:if="${contents}">
		<p class="sub">아래 버튼을 누르면 기기에 저장됩니다.</p>

		<div class="card" th:if="${contents.photoPreviewUrl}">
			<img class="preview" th:src="${contents.photoPreviewUrl}" alt="촬영한 사진">
		</div>

		<div class="actions">
			<a class="button" th:if="${contents.photoUrl}" th:href="${contents.photoUrl}">사진 저장하기</a>
			<a class="button secondary" th:if="${contents.videoUrl}" th:href="${contents.videoUrl}">영상 저장하기</a>
		</div>

		<!-- 앱이 스트립도 영상도 못 올린 경우. 링크는 살아 있으니 만료 안내와는 구분해서 말한다. -->
		<p class="sub" th:if="${contents.empty}">아직 준비된 사진이나 영상이 없습니다. 잠시 후 다시 열어 주세요.</p>

		<p class="note">
			이 링크는 <span th:text="${expiresAtText}">2026년 9월 7일 12:00</span>까지 열립니다.<br>
			사진은 그때까지만 보관되니 미리 저장해 주세요.
		</p>
	</div>
</main>
</body>
</html>
