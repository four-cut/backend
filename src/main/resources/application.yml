spring:
  application:
    name: photo
  profiles:
    active: local

  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s

  datasource:
    url: jdbc:mysql://localhost:3306/fourcut?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

fourcut:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    presigned-url-expiry-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:10080}
  session:
    expiry-minutes: 30
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:30}
  oauth:
    kakao:
      app-id: ${KAKAO_APP_ID:}
      admin-key: ${KAKAO_ADMIN_KEY:}
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
  auth:
    login-rate-limit-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:20}
